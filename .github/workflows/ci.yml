name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - "develop"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Installing...
        run: npm i
      - name: Building...
        env:
          CI: false
        run: npm run build

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Installing...
        run: npm i
      - name: Testing...
        run: npm test

  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Installing...
        run: npm i
      - name: Type Checking...
        run: npm run tsc

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Installing...
        run: npm i
      - name: Linting...
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start server
        run: |
          npm ci
          npm run start:ci > server.log 2>&1 &

      - name: Wait for server
        run: npx wait-on http-get://127.0.0.1:5173 --timeout 120000 || (cat server.log && exit 1)

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          record: false